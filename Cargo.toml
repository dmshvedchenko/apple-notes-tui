[workspace]
members = [
    "crates/notes-core",
    "crates/notes-bridge",
    "crates/notes-cache",
    "crates/notes-tui",
    "tools/notes-probe",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
